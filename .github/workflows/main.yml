name: Lint

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    
    permissions:
      security-events: write
      
    steps:
      - name: Bajar codigo
        uses: actions/checkout@v7

      - name: Analizar con pylint
        uses: advanced-security/python-lint-code-scanning-action@v1
        with:
          linter: pylint
